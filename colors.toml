# Patina — a muted, cool near-black theme.

mode = "dark"

accent = "#A2B5C1"
cursor = "#81c784"    # 3.x only; 4.x derives the cursor from bright_foreground

foreground = "#E1E1E1"
background = "#0d0e10"

# Surfaces: #0d0e10 -> #1a1c20 -> #262a30. dark/darker_background are derived.
lighter_background = "#1a1c20"
selection = "#262a30"

# Terminal text-selection highlight.
selection_foreground = "#0d0e10"
selection_background = "#A2B5C1"

# Pinned: orange would fall back to yellow, and brown is derived from orange.
orange = "#bf8071"
brown = "#734d44"

# Active window border; inactive is left to Omarchy's default.
hyprland_active_border = "#8DAA9A"

# Normal colors (ANSI 0-7)
color0 = "#0d0e10"
color1 = "#b46958"
color2 = "#8DAA9A"
color3 = "#F4BF75"
color4 = "#80909F"
color5 = "#AA749F"
color6 = "#88AFA2"
color7 = "#E1E1E1"

# Bright colors (ANSI 8-15)
color8 = "#727272"
color9 = "#c87e6b"
color10 = "#a8c070"
color11 = "#f9dfb2"
color12 = "#A2B5C1"
color13 = "#bf8ab4"
color14 = "#a2c2b7"
color15 = "#FFFFFF"
