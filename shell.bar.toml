# Overrides [bar]; a section override replaces the whole block.
# alpha 0.6 reads as frosted only where the omarchy-bar layer is blurred.
background       = "#0d0e10"
background-alpha = 0.6
text             = "#E1E1E1"
active           = "#b46958"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
