# Overrides [lock]; a section override replaces the whole block.
# Aligned with [polkit]. border-active is restated so the border stays constant
# while typing — omitted, it falls back to accent, not to border.
background       = "#0d0e10"
background-alpha = 1.0
text             = "#E1E1E1"
placeholder      = "#8A8885"
text-error       = "#b46958"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#b46958"
border-alpha     = 1.0
selection        = "#A2B5C1"
selection-alpha  = 0.45
